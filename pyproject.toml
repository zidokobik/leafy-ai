[project]
name = "Leafy-AI"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "apscheduler>=3.11.3",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "pwdlib[argon2]>=0.2.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.11.0",
    "sqlmodel>=0.0.42",
    "typer>=0.20.0",
    "uvicorn>=0.52.1",
]

[tool.ruff]
line-length = 120
extend-exclude = [".agents"]

[tool.ruff.format]
indent-style = "tab"

[dependency-groups]
dev = [
    "ruff>=0.16.5",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
